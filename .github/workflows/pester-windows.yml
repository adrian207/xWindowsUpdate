name: Pester Tests (Windows)

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  windows-tests:
    name: Run Pester tests on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: actions/setup-powershell@v2
        with:
          # Use an explicit PowerShell version; adjust if you prefer another
          pwsh-version: '7.4'

      - name: Run build and tests
        shell: pwsh
        run: |
          # Be explicit about trusting PSGallery to avoid prompts
          try {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
          } catch {
            Write-Verbose "Could not set PSGallery policy: $($_.Exception.Message)"
          }

          # Install common modules required for building and testing
          $modulesToInstall = @('Pester','DscResource.Test','InvokeBuild','PSDepend','PowerShell-Yaml')
          foreach ($m in $modulesToInstall) {
            try {
              if (-not (Get-Module -ListAvailable -Name $m)) {
                Write-Host "Installing module $m"
                Install-Module -Name $m -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
              } else {
                Write-Host "Module $m already available"
              }
            }
            catch {
              Write-Warning "Failed to install $m: $($_.Exception.Message)"
            }
          }

          # Run the repository's build script which performs AutoRestore and runs tests
          ./build.ps1 -AutoRestore -Tasks test

      - name: Upload Test Results (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: |
            **/TestResults
            **/*.trx
            **/*.xml
